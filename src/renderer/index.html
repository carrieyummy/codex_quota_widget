<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codex Quota Widget</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-state="loading">
    <main class="widget">
      <div class="ambient ambient-a"></div>
      <div class="ambient ambient-b"></div>
      <div class="resize-handle resize-n" data-edge="n"></div>
      <div class="resize-handle resize-e" data-edge="e"></div>
      <div class="resize-handle resize-s" data-edge="s"></div>
      <div class="resize-handle resize-w" data-edge="w"></div>
      <div class="resize-handle resize-ne" data-edge="ne"></div>
      <div class="resize-handle resize-se" data-edge="se"></div>
      <div class="resize-handle resize-sw" data-edge="sw"></div>
      <div class="resize-handle resize-nw" data-edge="nw"></div>

      <header class="titlebar">
        <div class="brand">
          <span
            id="trafficLight"
            class="traffic-light loading"
            aria-hidden="true"
          ></span>
          <div>
            <span id="brandName" class="brand-name">Codex 额度</span>
            <span id="stateText" class="brand-state">读取中</span>
          </div>
        </div>
        <div class="window-actions">
          <button
            id="refreshBtn"
            class="icon-button"
            title="刷新"
            aria-label="刷新"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M20 12a8 8 0 0 1-13.7 5.7M4 12A8 8 0 0 1 17.7 6.3M17 3v4h-4M7 21v-4h4"
              />
            </svg>
          </button>
          <button
            id="paletteBtn"
            class="icon-button"
            title="设置"
            aria-label="设置"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4A2 2 0 0 0 4 9.9l.2.1a2 2 0 0 1 1 1.7v.6a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.6a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"
              />
              <circle cx="12" cy="12" r="3" />
            </svg>
          </button>
          <button
            id="langBtn"
            class="text-button"
            title="Language"
            aria-label="Language"
          >
            EN
          </button>
          <button
            id="pinBtn"
            class="icon-button active"
            title="取消置顶"
            aria-label="取消置顶"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 4l5 5-4 1-3.5 3.5 1 3.5-2 2-3-5-5-3 2-2 3.5 1L12 7l1-4 2 1z" />
              <path d="M9 15l-5 5" />
            </svg>
          </button>
          <button
            id="minimizeBtn"
            class="icon-button"
            title="贴边收起"
            aria-label="贴边收起"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 5h4v14H4M13 7h7M13 12h7M13 17h7" />
            </svg>
          </button>
          <button
            id="closeBtn"
            class="icon-button"
            title="隐藏"
            aria-label="隐藏"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12h14" />
            </svg>
          </button>
        </div>
      </header>

      <section
        id="dockStrip"
        class="dock-strip"
        role="button"
        tabindex="0"
        aria-label="恢复窗口"
      >
        <span
          id="dockTrafficLight"
          class="traffic-light loading"
          aria-hidden="true"
        ></span>
        <span id="dockUpdatedAt" class="dock-time">--:--</span>
        <span class="dock-label dock-codex-label">Codex:</span>
        <span id="dockCodexPrimary" class="dock-percent">--</span>
        <span id="dockCodexPrimaryResetDate" class="dock-reset-date">--月--日</span>
        <span id="dockCodexPrimaryReset" class="dock-reset">--:--</span>
        <span id="dockCodexSecondary" class="dock-percent">--</span>
        <span class="dock-separator" aria-hidden="true">|</span>
        <span class="dock-label dock-spark-label">GPT-5.3 Spark:</span>
        <span id="dockSparkPrimary" class="dock-percent dock-spark-value"
          >--</span
        >
        <span id="dockSparkPrimaryResetDate" class="dock-reset-date dock-spark-value"
          >--月--日</span
        >
        <span id="dockSparkPrimaryReset" class="dock-reset dock-spark-value"
          >--:--</span
        >
        <span id="dockSparkSecondary" class="dock-percent dock-spark-value"
          >--</span
        >
      </section>

      <div id="themeOverlay" class="theme-overlay" hidden></div>

      <section id="themePanel" class="theme-panel" hidden>
        <label class="theme-field">
          <span id="bgColorLabel">背景色</span>
          <input id="bgColorInput" type="color" />
        </label>
        <label class="theme-field">
          <span id="textColorLabel">字体色</span>
          <input id="textColorInput" type="color" />
        </label>
        <label class="theme-field">
          <span id="opacityLabel">透明度</span>
          <input id="opacityInput" type="range" />
        </label>
        <label class="theme-field">
          <span id="fontScaleLabel">Font</span>
          <input id="fontScaleInput" type="range" />
        </label>
        <label class="theme-field">
          <span id="refreshIntervalLabel">刷新间隔</span>
          <span class="refresh-interval-control">
            <input
              id="refreshIntervalInput"
              type="number"
              min="0"
              step="1"
              inputmode="numeric"
              title="0 表示不自动刷新"
            />
            <span id="refreshIntervalUnit">秒</span>
          </span>
        </label>
      </section>

      <section class="content">
        <div
          id="quotaList"
          class="quota-list"
          aria-label="Codex 限额列表"
        ></div>
      </section>
    </main>

    <script src="./renderer.js"></script>
  </body>
</html>
